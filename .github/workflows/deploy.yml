name: Deploy to GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.0'
          extended: true

      - name: Build
        run: hugo --minify --gc --destination public_build

      - name: Deploy to cellsummer/cookbook
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.COOKBOOK_DEPLOY_KEY }}
          external_repository: cellsummer/cookbook
          publish_branch: main
          publish_dir: ./public_build
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
