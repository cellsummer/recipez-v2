<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
{{ partial "head.html" . }}
<body class="{{ .Kind }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  {{ $js := resources.Get "js/site.js" | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
